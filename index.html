<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f1117">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <!-- frame-ancestors/report-uri are deliberately omitted: they're no-ops in a
       meta-tag CSP (only take effect as a real HTTP header), and a static site
       with no server can't send one — GitHub Pages doesn't support custom headers.
       js/framebust.js (loaded first, below) refuses to run inside a frame instead.
       script-src/worker-src list the exact jsDelivr files the app loads (all via
       js/core/libs.js, incl. Chart.js and the pdf.js/Tesseract workers), not the
       whole CDN, which serves any GitHub repo's files. Keep them in sync when a
       library URL changes. The app's own UI fonts are self-hosted; the Google
       Fonts hosts in style-src/font-src remain only for the "luxury" invoice
       preview's fonts (ensureLuxuryFonts in js/modules/invoices.js). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1/tesseract-core-simd-lstm.wasm.js https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; frame-src 'self' blob:; connect-src 'self' https://*.workers.dev https://api.github.com https://raw.githubusercontent.com https://corsproxy.io https://api.allorigins.win https://cors.eu.org https://cdn.jsdelivr.net https://tessdata.projectnaptha.com; worker-src 'self' blob: https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js; base-uri 'self'; object-src 'none'">
  <script src="js/framebust.js"></script>
  <title>Business Tracking</title>
  <link rel="icon" href="assets/favicon.png?v=4">
  <link rel="apple-touch-icon" href="assets/favicon.png?v=4">
  <!-- UI fonts are self-hosted (@font-face in css/base.css); preload the two
       faces nearly every screen uses so text doesn't swap late. -->
  <link rel="preload" href="assets/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/inter-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/base.css?v=20260526">
  <link rel="stylesheet" href="css/layout.css?v=20260526">
  <link rel="stylesheet" href="css/components.css?v=20260526">
  <!-- Chart.js, jsPDF, pdf.js, Tesseract (OCR) and JSZip are loaded on demand by
       js/core/libs.js (pinned versions + SRI hashes). Chart.js starts downloading
       as soon as js/core/charts.js is imported, without holding up the app's boot;
       the others are only needed for invoice PDF generation/import and ZIP
       downloads, not on every page load. -->
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <div class="brand-logo">BT</div>
        <div>
          <div class="brand-name">Business Tracking</div>
          <div class="brand-sub">Properties &amp; Services</div>
        </div>
      </div>
      <div id="nav"></div>
      <div class="sidebar-footer">
        <div class="sync-status">
          <span id="sync-dot" class="sync-dot offline"></span>
          <span id="sync-text">Loading...</span>
          <button id="sync-retry" class="btn" style="display:none;margin-left:auto;font-size:10px;padding:2px 6px">Retry</button>
        </div>
      </div>
    </aside>

    <main id="main">
      <header id="header">
        <button id="mobile-menu-btn" aria-label="Open navigation menu">&#9776;</button>
        <div>
          <div id="header-title" class="header-title">Dashboard</div>
          <div class="header-subtitle">Global property &amp; services performance</div>
        </div>
        <div class="header-spacer"></div>
      </header>
      <div id="content"></div>
    </main>
  </div>

  <div id="mobile-backdrop"></div>
  <div id="modal-overlay" class="modal-overlay"></div>
  <div id="toasts"></div>

  <script type="module" src="js/bootstrap.js"></script>
</body>
</html>
