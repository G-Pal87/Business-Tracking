name: Tests

# Runs the node:test suite in scripts/tests. Data-only pushes (the app's saves,
# backups, attachments) don't run it.
on:
  push:
    paths-ignore:
      - 'data/db.json'
      - 'backups/**'
      - 'invoices/**'
      - 'debug/**'
      - 'docs/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            js
            scripts
            .github
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node --test scripts/tests/*.test.mjs
