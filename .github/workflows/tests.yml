name: Tests

# Runs the node:test suite in scripts/tests. Data-only pushes (the app's saves,
# backups, attachments) don't run it.
# Pushes run it on main only (working branches are covered when merged, or
# by a pull request); this avoids a duplicate run for every branch push.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/db.json'
      - 'backups/**'
      - 'invoices/**'
      - 'debug/**'
      - 'docs/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            js
            scripts
            .github
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test scripts/tests/*.test.mjs
