name: Daily Database Backup

on:
  schedule:
    - cron: '0 2 * * *'   # 2:00 AM UTC every day
  workflow_dispatch:        # Allow manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Create daily backup
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const MAX_BACKUPS = 30;
            const { owner, repo } = context.repo;

            // 1. Read current db.json
            let dbFile;
            try {
              const { data } = await github.rest.repos.getContent({
                owner, repo, path: 'data/db.json'
              });
              dbFile = data;
            } catch (e) {
              core.setFailed(`Failed to read data/db.json: ${e.message}`);
              return;
            }

            // The Contents API only inlines `content` for files under ~1MB —
            // past that it omits `content` entirely and expects a follow-up
            // fetch of `download_url` instead. Mirrors fetchDb()'s fallback
            // in js/core/github.js, which the app itself already relies on.
            // Without this, every run silently failed with "Unexpected end
            // of JSON input" the moment db.json crossed that size (it's
            // currently ~2MB) — Buffer.from(undefined, 'base64') decodes to
            // an empty string, and JSON.parse('') throws exactly that error.
            let text;
            if (dbFile.content) {
              text = Buffer.from(dbFile.content, 'base64').toString('utf8');
            } else if (dbFile.download_url) {
              const res = await fetch(dbFile.download_url);
              if (!res.ok) {
                core.setFailed(`Failed to download data/db.json via download_url (${res.status})`);
                return;
              }
              text = await res.text();
            } else {
              core.setFailed('data/db.json: Contents API returned neither content nor download_url');
              return;
            }

            let db;
            try {
              db = JSON.parse(text);
            } catch (e) {
              core.setFailed(`data/db.json is not valid JSON: ${e.message}`);
              return;
            }

            // Passive tripwire: this workflow has no access to the app's
            // encryption key (by design) and can't encrypt/decrypt anything
            // itself, so it can only mirror whatever state db.json is
            // already in. If a key is meant to be in use but db.json somehow
            // isn't encrypted right now, flag it loudly — silently backing
            // up plaintext without anyone noticing is the actual risk here.
            const looksEncrypted = db && typeof db === 'object' && db.enc === 1
              && typeof db.iv === 'string' && typeof db.ct === 'string';
            if (!looksEncrypted) {
              core.warning('data/db.json does not look like an encrypted envelope ({enc:1,iv,ct}) — this backup will be stored as PLAIN JSON. If encryption is supposed to be in use, check why the last push to db.json went out unencrypted.');
            }

            // Strip token — must never appear in backup files
            if (db.appConfig?.github?.token) delete db.appConfig.github.token;

            // 2. Build snapshot (same format as manual Export JSON)
            const today = new Date().toISOString().slice(0, 10);
            const filename = `bt-backup-${today}.json`;
            const backupPath = `backups/${filename}`;

            const snapshot = {
              exportVersion: 2,
              schemaVersion: 1,
              exportedAt: new Date().toISOString(),
              source: 'github-actions-daily-backup',
              snapshotName: filename,
              data: db
            };
            const b64 = Buffer.from(JSON.stringify(snapshot, null, 2)).toString('base64');

            // 3. Write backup (create or overwrite today's file)
            let existingSha;
            try {
              const { data: ex } = await github.rest.repos.getContent({
                owner, repo, path: backupPath
              });
              existingSha = ex.sha;
            } catch { /* file doesn't exist yet — that's fine */ }

            await github.rest.repos.createOrUpdateFileContents({
              owner, repo,
              path: backupPath,
              message: `Automated backup: ${filename}`,
              content: b64,
              ...(existingSha ? { sha: existingSha } : {})
            });

            core.info(`Backup saved: ${backupPath}`);

            // 4. Trim oldest backups beyond MAX_BACKUPS
            let items;
            try {
              const { data } = await github.rest.repos.getContent({
                owner, repo, path: 'backups'
              });
              items = Array.isArray(data) ? data : [];
            } catch (e) {
              core.warning(`Could not list backups/ for trimming: ${e.message}`);
              return;
            }

            const jsons = items
              .filter(f => f.type === 'file' && f.name.endsWith('.json'))
              .sort((a, b) => a.name.localeCompare(b.name)); // oldest first

            const excess = jsons.length - MAX_BACKUPS;
            for (let i = 0; i < excess; i++) {
              try {
                await github.rest.repos.deleteFile({
                  owner, repo,
                  path: jsons[i].path,
                  message: `Auto-trim old backup: ${jsons[i].name}`,
                  sha: jsons[i].sha
                });
                core.info(`Deleted old backup: ${jsons[i].path}`);
              } catch (e) {
                core.warning(`Failed to delete ${jsons[i].path}: ${e.message}`);
              }
            }

            core.info(`Done. Active backups: ${Math.min(jsons.length, MAX_BACKUPS)}`);
