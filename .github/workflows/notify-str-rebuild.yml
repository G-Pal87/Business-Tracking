name: Notify Short-Term-Rentals on rate update

# The rate feeds live on the single-commit `rates-feed` branch, which carries
# no workflow files, so a push there can't trigger anything. Instead the app
# fires a repository_dispatch (`rates-feed-published`) after each publish, and
# this forwards it to the Short-Term-Rentals site. That site also polls the
# feed on its own (watch-rates), so a missed event only delays the rebuild.
on:
  repository_dispatch:
    types: [rates-feed-published]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Short-Term-Rentals site rebuild
        run: |
          curl -s -f -X POST https://api.github.com/repos/G-Pal87/Short-Term-Rentals/dispatches \
            -H "Authorization: token ${{ secrets.STR_DEPLOY_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            -d '{"event_type":"rates-updated"}'
