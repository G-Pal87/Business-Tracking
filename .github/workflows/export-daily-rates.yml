name: Export daily-rate feeds

# Manual-only fallback regenerator for exports/daily-rates/.
#
# The in-app publisher (js/modules/str-rates.js → autoPublishRatesFeeds) is the
# single source of truth for the feeds: it runs the full weighted-blend pricing
# engine and publishes on every relevant change. This standalone script uses a
# simpler suggester, so running it automatically (on push / schedule) overwrote
# the app's feeds with different numbers — making published rates flip-flop.
#
# Triggers are therefore limited to manual dispatch. Use it only to bootstrap or
# repair feeds when the app hasn't published; expect simpler pricing than the app.
# It only works on an unencrypted db.json (this workflow has no key) and refuses
# to run otherwise.
on:
  workflow_dispatch:

permissions:
  contents: write

# Every workflow that writes the rates-feed branch shares this group, so two
# runs never race each other's force-push (the app itself can't join it;
# publish-rates-feed.sh uses --force-with-lease against that case).
concurrency:
  group: rates-feed
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Generate daily-rate feeds
        run: node scripts/export-daily-rates.js

      # Feeds go to the single-commit `rates-feed` branch, never to main, so
      # past prices don't accumulate in the public history.
      - name: Publish feeds to the rates-feed branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash .github/scripts/publish-rates-feed.sh

      - name: Trigger Short-Term-Rentals site rebuild
        env:
          STR_DEPLOY_TOKEN: ${{ secrets.STR_DEPLOY_TOKEN }}
        run: |
          curl -sS --fail-with-body -X POST https://api.github.com/repos/G-Pal87/Short-Term-Rentals/dispatches \
            -H "Authorization: token $STR_DEPLOY_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            -d '{"event_type":"rates-updated"}'
